name: 1. MiniOS LXFice Trixie Noble Resolute Sid (on Debian Trixie)

on:
  schedule:
    - cron: '0 0 */5 * *' # Run every 5 Days
  workflow_dispatch:

env:
  TZ: Etc/GMT-7
  iMageSize: 100GiB
  MainDir: /builder
  MiniOSBuild: zMiniOS.SkyLine.Build.05.2026.tar.xz
  MiniOSBuildDir: zMiniOS.SkyLine.Build.05.2026

jobs:
  build:
    name: MiniOS ${{ matrix.release }}
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged -v /dev:/dev # เชื่อมต่อ /dev ของโฮสต์เข้ากับ Container
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: trixie, Custom: false }
          - { release: noble, Custom: false }
          - { release: resolute, Custom: false }
          - { release: sid, Custom: false }

    steps:
      - name: Prepare | OS Update
        run: |
          apt-get update
          apt-get install -y sudo lvm2 udev

      - name: Prepare | Init & LVM
        run: |
          sudo apt-get install -y debootstrap squashfs-tools xz-utils xorriso \
            mtools rsync grub-common e2fsprogs pv wget btrfs-progs
          
          # สร้างไฟล์อิมเมจ
          sudo truncate -s $iMageSize /mnt.img
          sudo truncate -s $iMageSize /root.img
          Loop1=$(sudo losetup --find --show /mnt.img)
          Loop2=$(sudo losetup --find --show /root.img)
          
          # จัดการ LVM
          sudo pvcreate -f $Loop1 $Loop2
          sudo vgcreate -f github $Loop1 $Loop2
          sudo lvcreate -y -n runner -l 100%FREE github
          
          # กระตุ้นให้ Container มองเห็น Device Node ใหม่
          sudo vgscan
          sudo vgchange -ay github
          sudo mkfs.ext4 -F -O "^has_journal,sparse_super" -m 0 /dev/github/runner

          sudo mkdir -p $MainDir
          sudo mount /dev/github/runner $MainDir
          sudo chown -R runner:runner $MainDir
          df -Th

      - name: Prepare | Source Code
        working-directory: /builder
        run: |
          wget -q "https://github.com/1compk/minios/releases/download/live/${{ env.MiniOSBuild }}"
          tar -xf "${{ env.MiniOSBuild }}"

      - name: Build | Run
        working-directory: /builder/${{ env.MiniOSBuildDir }}
        run: |
           sudo -E ./minios-cmd -d ${{ matrix.release }} -a amd64 -de xfce -pv standard -c zstd -l en_US -tz "${TZ}" -kl -ib dracut

      - name: Upload | ISO
        uses: actions/upload-artifact@v7
        with:
          name: MiniOS-${{ matrix.release }}-${{ github.run_id }}
          path: /builder/${{ env.MiniOSBuildDir }}/build/iso/*.iso
          retention-days: 30
          archive: false
          if-no-files-found: error
