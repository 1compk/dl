name: 3.Build MiniOS LXFce Trixie Arm64
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
      
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip curl git wget ca-certificates binutils debootstrap \
            squashfs-tools xz-utils lz4 zstd xorriso mtools rsync \
            qemu-user-static binfmt-support \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu build-essential

      - name: Download, Decompress and Build
        run: |
          wget -q https://github.com/1compk/minios/releases/download/live/zMinios.Skyline.Build.03.2026.tar.xz
          tar -xf zMinios.Skyline.Build.03.2026.tar.xz 
          cd zMinios.Skyline.Build.03.2026/
          sudo sh armtx.xfce.build.sh

      - name: Upload MiniOS.Trixie.Arm64.iSO
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS.Trixie.Arm64.iSO
          path: zMinios.Skyline.Build.03.2026/build/iso/*.iso*
          if-no-files-found: error
          retention-days: 15
          
      - name: Upload MiniOS.Trixie.Arm64.SB
        uses: actions/upload-artifact@v4
        with:
          name: MiniOS.Trixie.SB
          path: zMinios.Skyline.Build.03.2026/build/trixie-standard-arm64/image/minios/*.sb*
          if-no-files-found: error
          retention-days: 15
