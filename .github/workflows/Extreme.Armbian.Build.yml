name: Armbian EXTREME Build System

on:
  workflow_dispatch:

env:
  TZ: Etc/GMT-7
  BUILDER_DIR: /builder

  # ===== CCACHE =====
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 50G

jobs:

# =========================================================
# 🔥 PHASE 1: BUILD KERNEL ONCE
# =========================================================
  kernel:
    name: Kernel Builder (Extreme Cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:

    - name: Init
      run: |
        sudo timedatectl set-timezone "${TZ}"
        sudo swapoff -a || true

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ccache git wget curl xfsprogs

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ hashFiles('**/compile.sh') }}
        restore-keys: kernel-ccache-

    - name: Create Fast Disk
      run: |
        sudo truncate -s 120G /disk.img
        sudo losetup /dev/loop6 /disk.img
        sudo mkfs.xfs -f /dev/loop6

        sudo mkdir -p $BUILDER_DIR
        sudo mount -o noatime,nodiratime,logbufs=8 \
          /dev/loop6 $BUILDER_DIR

        sudo chown -R runner:runner $BUILDER_DIR

    - name: Clone Armbian
      working-directory: /builder
      run: |
        git clone --depth=1 https://github.com/1compk/armbian.build.git armbian

    - name: Build Kernel Only
      working-directory: /builder/armbian
      run: |
        chmod +x compile.sh

        export CI=true
        export DEBIAN_FRONTEND=noninteractive

        ./compile.sh build \
         EXPERT=yes \
         BOARD=uefi-x86 \
         BRANCH=edge \
         RELEASE=forky \
         BUILD_MINIMAL=yes \
         BUILD_DESKTOP=no \
         KERNEL_ONLY=yes \
         KERNEL_CONFIGURE=no \
         KERNEL_GIT=no \
         DOCKER_ARMBIAN=no \
         SKIP_ARMBIAN_CONFIG=yes \
         USE_CCACHE=yes \
         CCACHE_DIR=$CCACHE_DIR \
         BUILD_ALL=no \
         SHOW_LOG=no

    - name: Upload Kernel Cache
      uses: actions/upload-artifact@v4
      with:
        name: kernel-cache
        path: |
          /builder/armbian/output/debs
          /builder/armbian/cache
        retention-days: 1

# =========================================================
# 🚀 PHASE 2: PARALLEL IMAGE BUILDS
# =========================================================
  build:
    name: ${{ matrix.board }}-${{ matrix.variant }}
    needs: kernel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 600

    strategy:
      fail-fast: false
      matrix:
        include:

          - board: aml-s9xx-box
            runner: ubuntu-24.04-arm
            variant: xfce
            desktop: yes

          - board: aml-s9xx-box
            runner: ubuntu-24.04-arm
            variant: cli
            desktop: no

          - board: uefi-x86
            runner: ubuntu-24.04
            variant: xfce
            desktop: yes

          - board: uefi-x86
            runner: ubuntu-24.04
            variant: cli
            desktop: no

    steps:

    - name: Init System
      run: |
        sudo swapoff -a || true
        sudo timedatectl set-timezone "${TZ}"

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ccache git wget curl xfsprogs

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: build-ccache-${{ matrix.board }}
        restore-keys: build-ccache-

    - name: Create Ultra Disk
      run: |
        sudo truncate -s 100G /disk.img
        sudo losetup /dev/loop6 /disk.img
        sudo mkfs.xfs -f /dev/loop6

        sudo mkdir -p $BUILDER_DIR
        sudo mount -o noatime,nodiratime,logbufs=8 \
          /dev/loop6 $BUILDER_DIR

        sudo chown -R runner:runner $BUILDER_DIR

    - name: Clone Armbian
      working-directory: /builder
      run: |
        git clone --depth=1 https://github.com/1compk/armbian.build.git armbian

    - name: Download Kernel Cache
      uses: actions/download-artifact@v4
      with:
        name: kernel-cache
        path: /builder/armbian/

    - name: Build Image (No Kernel Compile 🚀)
      working-directory: /builder/armbian
      run: |
        chmod +x compile.sh

        if [ "${{ matrix.desktop }}" = "yes" ]; then
          DESKTOP="BUILD_DESKTOP=yes DESKTOP_ENVIRONMENT=xfce"
        else
          DESKTOP="BUILD_DESKTOP=no"
        fi

        ./compile.sh build \
          EXPERT=yes \
          BOARD=${{ matrix.board }} \
          BRANCH=edge \
          RELEASE=forky \
          $DESKTOP \
          KERNEL_ONLY=no \
          USE_CCACHE=yes \
          CCACHE_DIR=$CCACHE_DIR \
          SKIP_ARMBIAN_CONFIG=yes

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Armbian-${{ matrix.board }}-${{ matrix.variant }}
        path: /builder/armbian/output/images/*.img*
        retention-days: 30
