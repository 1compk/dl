name: 3.Build Armbian CLi Forky Aml-S9xx Uefi-x86 (Parallel)
on:
  workflow_dispatch:

env:
  TZ: Etc/GMT-7
  CCACHE_DIR: /home/.ccache 

jobs:
  build-aml-s9xx:
    name: Build Armbian CLi Forky Aml-S9xx
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 600
    steps:
      - name: Prepare | Get Date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Prepare | Initialize & Install Dependencies
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E systemctl daemon-reload
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ:-Etc/GMT-7}"
          sudo -E timedatectl set-ntp true
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Prepare | Install & Configure ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          sudo mkdir -p /home/.ccache
          sudo chown -R runner:runner /home/.ccache
          ccache -M 10G

      - name: Prepare | Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/.ccache
          key: ccache-aml-s9xx-${{ steps.date.outputs.DATE }}-${{ github.run_id }}
          restore-keys: |
            ccache-aml-s9xx-

      - name: Prepare | Create Virtual Disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "100"G /mnt/mnt.img
          sudo truncate -s "100"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Prepare | Download Build Files & Setup Paths
        working-directory: /builder
        run: |
          git clone --depth 1 https://github.com/1compk/armbian.build.git armbian
          mkdir -p armbian/output armbian/sources armbian/cache armbian/userpatches
          sudo chown -R runner:runner /builder/armbian

      - name: Prepare | Cache Armbian Build Output and Sources
        uses: actions/cache@v4
        with:
          path: |
            /builder/armbian/output
            /builder/armbian/sources
            /builder/armbian/cache
            /builder/armbian/userpatches
          key: armbian-build-aml-s9xx-${{ steps.date.outputs.DATE }}-${{ github.run_id }}
          restore-keys: |
            armbian-build-aml-s9xx-

      - name: Build | Armbian
        working-directory: /builder/armbian
        run: |
          sudo chown -R runner:runner /builder/armbian
          chmod +x compile.sh
          ./compile.sh build EXPERT=yes BOARD=aml-s9xx-box BRANCH=edge RELEASE=forky \
          BUILD_DESKTOP=no BUILD_MINIMAL=no DESKTOP_APPGROUPS_SELECTED= \
          DESKTOP_ENVIRONMENT= DESKTOP_ENVIRONMENT_CONFIG_NAME= \
          KERNEL_BTF=no KERNEL_CONFIGURE=no KERNEL_GIT=shallow \
          DOCKER_ARMBIAN=no USE_CCACHE=yes CCACHE_DIR=/home/.ccache

      - name: Upload | Armbian.iMG
        uses: actions/upload-artifact@v7
        with:
          name: Armbian.CLi.Forky.Aml-S9xx-${{ steps.date.outputs.DATE }}
          path: /builder/armbian/output/images/*.img
          if-no-files-found: error
          retention-days: 90


  build-uefi-x86:
    name: Build Armbian CLi Forky Uefi-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - name: Prepare | Get Date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Prepare | Initialize & Install Dependencies
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E systemctl daemon-reload
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "${TZ:-Etc/GMT-7}"
          sudo -E timedatectl set-ntp true
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Prepare | Install & Configure ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          sudo mkdir -p /home/.ccache
          sudo chown -R runner:runner /home/.ccache
          ccache -M 10G

      - name: Prepare | Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/.ccache
          key: ccache-uefi-x86-${{ steps.date.outputs.DATE }}-${{ github.run_id }}
          restore-keys: |
            ccache-uefi-x86-

      - name: Prepare | Create Virtual Disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "100"G /mnt/mnt.img
          sudo truncate -s "100"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          df -Th

      - name: Prepare | Download Build Files & Setup Paths
        working-directory: /builder
        run: |
          git clone --depth 1 https://github.com/1compk/armbian.build.git armbian
          mkdir -p armbian/output armbian/sources armbian/cache armbian/userpatches
          sudo chown -R runner:runner /builder/armbian

      - name: Prepare | Cache Armbian Build Output and Sources
        uses: actions/cache@v4
        with:
          path: |
            /builder/armbian/output
            /builder/armbian/sources
            /builder/armbian/cache
            /builder/armbian/userpatches
          key: armbian-build-uefi-x86-${{ steps.date.outputs.DATE }}-${{ github.run_id }}
          restore-keys: |
            armbian-build-uefi-x86-

      - name: Build | Armbian
        working-directory: /builder/armbian
        run: |
          sudo chown -R runner:runner /builder/armbian
          chmod +x compile.sh
          ./compile.sh build EXPERT=yes BOARD=uefi-x86 BRANCH=edge RELEASE=forky \
          BUILD_DESKTOP=no BUILD_MINIMAL=no DESKTOP_APPGROUPS_SELECTED= \
          DESKTOP_ENVIRONMENT= DESKTOP_ENVIRONMENT_CONFIG_NAME= \
          KERNEL_BTF=no KERNEL_CONFIGURE=no KERNEL_GIT=shallow \
          DOCKER_ARMBIAN=no USE_CCACHE=yes CCACHE_DIR=/home/.ccache
           
      - name: Upload | Armbian.iMG
        uses: actions/upload-artifact@v7
        with:
          name: Armbian.CLi.Forky.Uefi-x86-${{ steps.date.outputs.DATE }}
          path: /builder/armbian/output/images/*.img
          archive: true
          if-no-files-found: error
          retention-days: 90
